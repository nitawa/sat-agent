[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-agent"
version = "0.1.0"
description = "AI Agent for SALOME compilation, pyconf configuration, and platform porting using SAT & SAT_SALOME"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph",
    "requests",
    "typing-extensions>=4.16.0",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sat-agent = "sat_agent.cli:main"

[tool.setuptools]
packages = [
    "sat_agent",
    "sat_agent.nodes",
    "sat_agent.specialists",
    "sat_agent.verify",
    "sat_executor",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
