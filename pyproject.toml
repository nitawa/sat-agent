[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sat-agent"
version = "0.2.0"
description = "LangGraph agents porting SALOME (SAT / SAT_SALOME) to new Linux platforms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "requests",
    "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
sat-agent = "sat_agent.cli:main"

[tool.setuptools]
packages = ["sat_agent", "sat_agent.nodes", "sat_agent.agents", "sat_agent.tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
